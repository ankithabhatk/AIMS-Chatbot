<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIMS Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            height: 600px;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px 12px 0 0;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f9f9f9;
        }

        .message {
            margin-bottom: 15px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            text-align: right;
        }

        .message.bot {
            text-align: left;
        }

        .message-content {
            display: inline-block;
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 80%;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: #667eea;
            color: white;
        }

        .message.bot .message-content {
            background: #e0e0e0;
            color: #333;
        }

        .message.bot .message-content.error {
            background: #ffebee;
            color: #c62828;
        }

        .message.bot .message-content.loading {
            background: #fff3e0;
            color: #e65100;
        }

        .confidence {
            font-size: 12px;
            margin-top: 5px;
            opacity: 0.7;
        }

        .sources {
            font-size: 12px;
            margin-top: 8px;
            padding: 8px;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 6px;
        }

        .source-link {
            display: block;
            margin: 4px 0;
            color: #667eea;
            text-decoration: none;
            word-break: break-word;
        }

        .source-link:hover {
            text-decoration: underline;
        }

        .input-area {
            padding: 20px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        .input-group {
            flex: 1;
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover:not(:disabled) {
            background: #5568d3;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .status {
            font-size: 12px;
            padding: 5px 0;
            color: #666;
        }

        .status.loading {
            color: #ff9800;
        }

        .status.error {
            color: #f44336;
        }

        .status.success {
            color: #4caf50;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎓 AIMS Chatbot</h1>
            <p>Ask questions about AIMS</p>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message bot">
                <div class="message-content">
                    👋 Welcome! I'm the AIMS chatbot. Ask me anything about programs, fees, placement, facilities, or admissions.
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-group">
                <input
                    type="text"
                    id="queryInput"
                    placeholder="Ask a question..."
                    autocomplete="off"
                />
                <button id="sendBtn" onclick="sendQuery()">Send</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000/api/v1/chat';
        const chatMessages = document.getElementById('chatMessages');
        const queryInput = document.getElementById('queryInput');
        const sendBtn = document.getElementById('sendBtn');

        let sessionId = 'session_' + Date.now() + '_' + Math.random().toString(36).substring(7);
        let isLoading = false;

        function addMessage(text, isUser = false, isError = false, isLoading = false, metadata = null) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content' + (isError ? ' error' : '') + (isLoading ? ' loading' : '');
            contentDiv.innerHTML = text;

            messageDiv.appendChild(contentDiv);

            // Add metadata (confidence, sources) if provided
            if (metadata && !isUser && !isError && !isLoading) {
                if (metadata.confidence !== undefined) {
                    const confidenceDiv = document.createElement('div');
                    confidenceDiv.className = 'confidence';
                    confidenceDiv.textContent = `✅ Confidence: ${(metadata.confidence * 100).toFixed(0)}%`;
                    messageDiv.appendChild(confidenceDiv);
                }

                if (metadata.sources && metadata.sources.length > 0) {
                    const sourcesDiv = document.createElement('div');
                    sourcesDiv.className = 'sources';
                    sourcesDiv.innerHTML = '<strong>Sources:</strong>';

                    metadata.sources.forEach(source => {
                        const linkDiv = document.createElement('a');
                        linkDiv.className = 'source-link';
                        linkDiv.href = source.url;
                        linkDiv.target = '_blank';
                        linkDiv.textContent = '📄 ' + (source.title || source.url);
                        sourcesDiv.appendChild(linkDiv);
                    });

                    messageDiv.appendChild(sourcesDiv);
                }
            }

            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            return messageDiv;
        }

        async function sendQuery() {
            const query = queryInput.value.trim();

            if (!query) {
                alert('Please enter a question');
                return;
            }

            if (isLoading) return;

            // Add user message
            addMessage(query, true);
            queryInput.value = '';
            isLoading = true;
            sendBtn.disabled = true;

            // Add loading message
            const loadingMsg = addMessage('🤔 Thinking...', false, false, true);

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        query: query,
                        session_id: sessionId
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();

                // Remove loading message
                loadingMsg.remove();

                // Add bot response
                const answer = data.answer || 'No answer available';
                const metadata = {
                    confidence: data.confidence || 0,
                    sources: data.sources || []
                };

                addMessage(answer, false, false, false, metadata);

                // Add suggestions if available
                if (data.suggestions && data.suggestions.length > 0) {
                    const suggestionsDiv = document.createElement('div');
                    suggestionsDiv.className = 'message bot';
                    const contentDiv = document.createElement('div');
                    contentDiv.className = 'message-content';

                    let suggestionsHTML = '<strong>💡 You might also ask:</strong><br>';
                    data.suggestions.forEach(suggestion => {
                        suggestionsHTML += `<div style="margin-top: 5px; cursor: pointer; color: #667eea; text-decoration: underline;" onclick="document.getElementById('queryInput').value = '${suggestion.replace(/'/g, "\\'")}'; sendQuery();">${suggestion}</div>`;
                    });

                    contentDiv.innerHTML = suggestionsHTML;
                    suggestionsDiv.appendChild(contentDiv);
                    chatMessages.appendChild(suggestionsDiv);
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                }

            } catch (error) {
                // Remove loading message
                loadingMsg.remove();

                // Add error message
                addMessage(
                    `❌ Error: ${error.message}<br><small>Make sure the API is running at ${API_URL}</small>`,
                    false,
                    true
                );
            } finally {
                isLoading = false;
                sendBtn.disabled = false;
                queryInput.focus();
            }
        }

        // Allow Enter key to send
        queryInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !isLoading) {
                sendQuery();
            }
        });

        // Focus input on load
        queryInput.focus();
    </script>
</body>
</html>
